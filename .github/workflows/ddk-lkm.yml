name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260313'
        type: string
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string
      vivo:
        description: 'Inject vivo vermagic for vivo/iQOO GKI kernel compatibility'
        required: false
        default: false
        type: boolean

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Inject vivo vermagic
      if: ${{ inputs.vivo }}
      run: |
        set -euo pipefail
        KMI="${{ inputs.kmi }}"
        ANDROID_VER=$(echo "$KMI" | cut -d- -f1 | sed 's/android//')
        KERNEL_VER=$(echo "$KMI" | cut -d- -f2)

        # Build identifier: e.g. android14-6.1-vivo
        KMI_VIVO="${KMI}-vivo"
        echo ">>> Injecting vivo vermagic for ${KMI_VIVO} (android=${ANDROID_VER}, kernel=${KERNEL_VER})"

        case "$KMI" in
          android12-5.10|android13-5.10)
            UTS_STRING="5.10.233-android12-9-g28b19682acbc-dirty"
            PATCH_UTS="false"
            ;;
          android14-6.1)
            UTS_STRING="6.1.145-android14-11-maybe-dirty"
            PATCH_UTS="true"
            ;;
          *)
            UTS_STRING="${KERNEL_VER}.0-android${ANDROID_VER}-0-maybe-dirty"
            PATCH_UTS="true"
            echo "WARNING: KMI=${KMI_VIVO} uses generic vivo vermagic template: $UTS_STRING"
            echo "If module loading fails with vermagic mismatch, update this mapping."
            ;;
        esac

        VMAGIC_STRING="${UTS_STRING} SMP preempt mod_unload modversions vivo aarch64"

        echo "Target vermagic: $VMAGIC_STRING"
        echo "Patch utsrelease: $PATCH_UTS"

        # Patch vermagic.h in the DDK kernel headers.
        # Use subshell + || true to prevent find from killing the script under
        # set -e when encountering permission errors in container environments.
        VERMAGIC_H=$(find /usr/src -name "vermagic.h" -path "*/generated/*" 2>/dev/null | head -1) || true
        if [ -z "$VERMAGIC_H" ]; then
          VERMAGIC_H=$(find / -name "vermagic.h" 2>/dev/null | head -1) || true
        fi

        if [ -n "$VERMAGIC_H" ] && [ -f "$VERMAGIC_H" ]; then
          echo "Found vermagic.h: $VERMAGIC_H"
          sed -i "/#define VERMAGIC_STRING/c\#define VERMAGIC_STRING \"$VMAGIC_STRING\"" "$VERMAGIC_H" || true
          grep "VERMAGIC_STRING" "$VERMAGIC_H" || true
        else
          echo "WARNING: vermagic.h not found, adding -D override to ccflags"
          echo "ccflags-y += -DVERMAGIC_STRING=\"${VMAGIC_STRING}\"" >> kernel/Kbuild
        fi

        # Patch utsrelease.h if needed for vivo kernel version matching
        if [ "$PATCH_UTS" = "true" ]; then
          UTS_H=$(find /usr/src -name "utsrelease.h" -path "*/generated/*" 2>/dev/null | head -1) || true
          if [ -z "$UTS_H" ]; then
            UTS_H=$(find / -name "utsrelease.h" 2>/dev/null | head -1) || true
          fi
          if [ -n "$UTS_H" ] && [ -f "$UTS_H" ]; then
            echo "Found utsrelease.h: $UTS_H"
            sed -i "s/UTS_RELEASE \"\([^\"]*\)\"/UTS_RELEASE \"${UTS_STRING}\"/" "$UTS_H" || true
            grep "UTS_RELEASE" "$UTS_H" || true
          else
            echo "WARNING: utsrelease.h not found, adding -D override to ccflags"
            echo "ccflags-y += -DUTS_RELEASE=\"${UTS_STRING}\"" >> kernel/Kbuild
          fi
        fi

        # Export KMI_VIVO for downstream build/artifact steps
        echo "KMI_VIVO=${KMI_VIVO}" >> $GITHUB_ENV
        echo ">>> Vivo vermagic injection complete for ${KMI_VIVO}"

    - name: Build kernelsu.ko
      env:
        EXPECTED_SIZE2: ${{ inputs.expected_size2 }}
        EXPECTED_HASH2: ${{ inputs.expected_hash2 }}
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$EXPECTED_SIZE2" ] && [ -z "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_hash2 must be provided when expected_size2 is set."
          exit 1
        fi
        if [ -z "$EXPECTED_SIZE2" ] && [ -n "$EXPECTED_HASH2" ]; then
          echo "ERROR: expected_size2 must be provided when expected_hash2 is set."
          exit 1
        fi
        if [ -n "$EXPECTED_SIZE2" ]; then
          EXTRA_ARGS="KSU_EXPECTED_SIZE2=$EXPECTED_SIZE2 KSU_EXPECTED_HASH2=$EXPECTED_HASH2"
        fi
        CONFIG_KSU=m CC=clang make $EXTRA_ARGS
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        mkdir -p /github/workspace/out

        # Copy with KMI-specific naming (use -vivo suffix for vivo builds, e.g. android14-6.1-vivo_kernelsu.ko)
        if [ "${{ inputs.vivo }}" = "true" ]; then
          OUTPUT_NAME="${KMI_VIVO}_kernelsu.ko"
        else
          OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        fi
        cp kernelsu.ko "/github/workspace/out/$OUTPUT_NAME"

        echo "Copied to: /github/workspace/out/$OUTPUT_NAME"
        ls -la "/github/workspace/out/$OUTPUT_NAME"
        echo "Size: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "/github/workspace/out/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.kmi }}${{ inputs.vivo && '-vivo' || '' }}-lkm
        path: /github/workspace/out/${{ inputs.kmi }}${{ inputs.vivo && '-vivo' || '' }}_kernelsu.ko
